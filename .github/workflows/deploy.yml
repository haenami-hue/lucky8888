name: GitHub Pages 배포

on:
  push:
    branches: [main]
  # 당첨결과 갱신 커밋은 GITHUB_TOKEN 으로 푸시되어 push 트리거가 안 걸리므로 완료 이벤트로 받는다
  workflow_run:
    workflows: ["당첨결과 갱신"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 카카오톡 미리보기 이미지용 절대 주소 (https://<계정>.github.io/<저장소>/)
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
