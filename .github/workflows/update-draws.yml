name: 당첨결과 갱신

on:
  schedule:
    - cron: "0 15 * * 6" # 토요일 15:00 UTC = 일요일 00:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-draws.mjs
      - name: 변경 시 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/data/draws.json
          git diff --cached --quiet || git commit -m "chore: 당첨결과 갱신" && git push
